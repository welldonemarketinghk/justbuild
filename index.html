<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JUST BUILD HK｜AI Demo 片建議 5 款</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0B0B0B;
    color: #F8F5EC;
    font-family: "Microsoft JhengHei", "PingFang SC", -apple-system, sans-serif;
    padding: 48px 20px 80px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 48px; }
  .kicker {
    color: #9A7B1E;
    font-size: 12px;
    letter-spacing: 4px;
    margin-bottom: 12px;
  }
  h1 {
    font-size: clamp(24px, 5vw, 38px);
    color: #D4AF37;
    letter-spacing: 1px;
  }
  .sub {
    margin-top: 12px;
    color: #8B8674;
    font-size: 13px;
  }
  .card {
    background: #141414;
    border: 1px solid #2a2416;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 36px;
  }
  .card h2 {
    font-size: 17px;
    font-weight: 700;
    color: #F2D878;
    padding: 16px 20px 12px;
    letter-spacing: 0.5px;
  }
  .card h2 .num {
    color: #D4AF37;
    margin-right: 10px;
  }
  .video {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
  }
  .video iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  footer {
    text-align: center;
    color: #6E6A5E;
    font-size: 11px;
    margin-top: 24px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">JUST BUILD HK</div>
    <h1>AI Demo 片建議 5 款</h1>
    <div class="sub">每款直接撳片睇</div>
  </header>

  <div class="card">
    <h2><span class="num">1</span>產品奢華旋轉廣告（15–30 秒）</h2>
    <div class="video"><iframe src="https://www.youtube-nocookie.com/embed/za0dA6_mtHI" title="Demo 1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
  </div>

  <div class="card">
    <h2><span class="num">2</span>Before / After 對比片（15–30 秒）</h2>
    <div class="video"><iframe src="https://www.youtube-nocookie.com/embed/goqkZhcQWM8" title="Demo 2" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
  </div>

  <div class="card">
    <h2><span class="num">3</span>UGC 開箱 / 用家示範（30 秒）</h2>
    <div class="video"><iframe src="https://www.youtube-nocookie.com/embed/4xvfGUYhwUw" title="Demo 3" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
  </div>

  <div class="card">
    <h2><span class="num">4</span>電影級 CGI 特效片（15–30 秒）</h2>
    <div class="video"><iframe src="https://www.youtube-nocookie.com/embed/sSOoDyrughE" title="Demo 4" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
  </div>

  <div class="card">
    <h2><span class="num">5</span>Motion Graphics 成分卡動畫（15 秒）</h2>
    <div class="video"><iframe src="https://www.youtube-nocookie.com/embed/TkYknC7JhAQ" title="Demo 5" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
  </div>

  <footer>做得很好廣告策劃有限公司 Well Done Marketing｜JUST BUILD HK</footer>
</div>
</body>
</html>
